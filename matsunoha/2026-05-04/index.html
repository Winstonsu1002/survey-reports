<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>松韻 前導問卷分析報告</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans TC',sans-serif;background:#faf9f6;min-height:100vh;color:#1a1a1a}
/* ── Lock screen ── */
#lock-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.lock-card{text-align:center;max-width:400px;width:100%}
.lock-icon{width:64px;height:64px;margin:0 auto 20px;background:#e8f5e7;border-radius:50%;display:flex;align-items:center;justify-content:center}
.lock-icon svg{width:28px;height:28px;stroke:#3a6639;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lock-title{font-family:'Noto Serif TC',serif;font-size:28px;color:#1a1a1a;margin-bottom:6px;letter-spacing:.04em}
.lock-sub{color:#999;font-size:13px;margin-bottom:28px}
.input-wrap{position:relative;margin-bottom:12px}
.input-wrap input{width:100%;padding:13px 48px 13px 16px;border:2px solid #e0e0e0;border-radius:10px;font-size:15px;font-family:'Noto Sans TC',sans-serif;background:#fff;outline:none;transition:border-color .2s;color:#1a1a1a}
.input-wrap input:focus{border-color:#5a9e57}
.input-wrap button{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:none;background:#3a6639;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
.input-wrap button:hover{background:#2a5228}
.input-wrap button svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
#error-msg{color:#c0392b;font-size:13px;min-height:18px;margin-bottom:8px;opacity:0;transition:opacity .2s}
#error-msg.show{opacity:1}
.hint{color:#bbb;font-size:12px}
/* ── Loading spinner ── */
#loading{display:none;position:fixed;inset:0;background:#faf9f6;align-items:center;justify-content:center;z-index:200}
.spinner{width:36px;height:36px;border:3px solid #e0e0e0;border-top-color:#3a6639;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* ── Report body ── */
#report-container{display:none;max-width:860px;margin:0 auto;padding:48px 32px 96px}
#report-container h1{font-family:'Noto Serif TC',serif;font-size:30px;line-height:1.4;margin-bottom:8px;padding-bottom:16px;border-bottom:2px solid #e0e0e0}
#report-container h2{font-family:'Noto Serif TC',serif;font-size:22px;margin:40px 0 14px;color:#1a1a1a}
#report-container h3{font-size:17px;font-weight:600;margin:28px 0 10px;color:#2a2a2a}
#report-container h4{font-size:15px;font-weight:600;margin:20px 0 8px;color:#444}
#report-container p{line-height:1.85;color:#333;margin-bottom:14px}
#report-container ul,#report-container ol{margin:0 0 14px 22px;line-height:1.85;color:#333}
#report-container li{margin-bottom:4px}
#report-container strong{color:#1a1a1a}
#report-container table{width:100%;border-collapse:collapse;margin:16px 0 24px;font-size:14px;line-height:1.6}
#report-container th{background:#f0f7ef;color:#2a4a28;font-weight:600;padding:10px 14px;text-align:left;border:1px solid #cce0ca}
#report-container td{padding:9px 14px;border:1px solid #e4e4e4;color:#333;vertical-align:top}
#report-container tr:nth-child(even) td{background:#f9fdf8}
#report-container img{max-width:100%;height:auto;border-radius:8px;margin:12px 0 20px;display:block;box-shadow:0 2px 12px rgba(0,0,0,.08)}
#report-container blockquote{border-left:4px solid #5a9e57;padding:12px 18px;background:#f5fbf4;margin:16px 0;border-radius:0 6px 6px 0;color:#444;font-style:italic}
#report-container code{background:#f4f4f4;padding:2px 6px;border-radius:4px;font-size:13px;font-family:'SFMono-Regular',Consolas,monospace}
#report-container pre{background:#f4f4f4;padding:16px;border-radius:8px;overflow-x:auto;margin:0 0 16px}
#report-container pre code{background:none;padding:0;font-size:13px}
#report-container hr{border:none;border-top:1px solid #e8e8e8;margin:36px 0}
</style>
</head>
<body>

<div id="lock-screen">
  <div class="lock-card">
    <div class="lock-icon">
      <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <h1 class="lock-title">松韻 前導問卷分析報告</h1>
    <p class="lock-sub">問卷分析報告 ― 需要密碼才能檢視</p>
    <p id="error-msg">密碼錯誤，請重新輸入</p>
    <div class="input-wrap">
      <input type="password" id="pwd" placeholder="請輸入密碼" autocomplete="off"
             onkeydown="if(event.key==='Enter')unlock()">
      <button onclick="unlock()" aria-label="解鎖">
        <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </div>
    <p class="hint">輸入後按 Enter 或點擊箭頭</p>
  </div>
</div>

<div id="loading"><div class="spinner"></div></div>
<div id="report-container"></div>

function b64ToBytes(b64) {
  const bin = atob(b64), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}

async function unlock() {
  const pwd = document.getElementById('pwd').value.trim();
  if (!pwd) return;
  const loading = document.getElementById('loading');
  loading.style.display = 'flex';
  try {
    const buf   = b64ToBytes(ENC);
    const salt  = buf.slice(0, 16);
    const iv    = buf.slice(16, 28);
    const ct    = buf.slice(28);
    const km = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(pwd), 'PBKDF2', false, ['deriveKey']
    );
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
      km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
    );
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
    const html  = new TextDecoder().decode(plain);
    document.getElementById('lock-screen').style.display = 'none';
    loading.style.display = 'none';
    const c = document.getElementById('report-container');
    c.style.display = 'block';
    c.innerHTML = html;
    window.scrollTo(0, 0);
  } catch (e) {
    loading.style.display = 'none';
    const msg = document.getElementById('error-msg');
    msg.classList.add('show');
    setTimeout(() => msg.classList.remove('show'), 3000);
    document.getElementById('pwd').value = '';
    document.getElementById('pwd').focus();
  }
}
</script>
